[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ast-seoultech-lms"
version = "0.1.0"
description = "Local read-only SeoulTech LMS connector for AST"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "playwright>=1.49,<2", "beautifulsoup4>=4.12,<5", "mcp>=1.13,<2", "pypdf>=6,<7", "truststore>=0.10.4,<1"]

[project.scripts]
seoultech-lms = "seoultech_lms.cli:main"
seoultech-lms-mcp = "seoultech_lms.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seoultech_lms = ["department_notice_sources.json"]

